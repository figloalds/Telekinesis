plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.tkfs.spike'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.tkfs.spike'
        // openProxyFileDescriptor needs API 26.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.0.1-spike'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
