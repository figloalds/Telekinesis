plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'dev.tkfs'
    compileSdk = 35

    defaultConfig {
        applicationId = 'dev.tkfs'
        // openProxyFileDescriptor needs API 26.
        minSdk = 26
        // Below 37, which would have to ask for ACCESS_LOCAL_NETWORK at run time.
        targetSdk = 35
        versionCode = 1
        versionName = '0.1.0'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // These build against compileSdk 35; a newer release may ask for 36.
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is empty stubs in a JVM test.
    testImplementation 'org.json:json:20250517'
}
