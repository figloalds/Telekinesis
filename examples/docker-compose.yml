services:
  tkfs-daemon:
    image: ubuntu:24.04
    container_name: tkfs_daemon
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    # The orchestrator handles SIGTERM itself (a bounded 30 s shutdown, with
    # FORCED_STOP logged for any worker it had to force): no shell trap is
    # needed. Docker waits this long before it sends SIGKILL.
    stop_grace_period: 60s

    # --- MOUNTING (off by default: folders run headless) ---
    # Mounts of orchestrator-managed folders come with a later plan. When they
    # do, expose FUSE inside the container like this:
    #   1. uncomment the block below;
    #   2. add "fuse3" to PACKAGES in the command.
    # devices:
    #   - /dev/fuse:/dev/fuse  # Shares the host's FUSE device with the container
    # cap_add:
    #   - SYS_ADMIN            # Allows the container to mount
    # security_opt:
    #   - apparmor:unconfined  # Keeps AppArmor from blocking the mount (common on Ubuntu)
    # -------------------------------------------------------

    volumes:
      # The directory holding this file: the tkfs binary, orchestrator.toml
      # (created on first start) and data/ (the catalog and every folder).
      - .:/app

    # Platform packages only; TKFS does not install device certificates or CA roots.
    # `$$` keeps Compose from interpolating the shell variable.
    command:
      - sh
      - -c
      - |
        PACKAGES="ca-certificates libssl3t64"
        if ! dpkg -s $$PACKAGES >/dev/null 2>&1; then
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $$PACKAGES || exit 1
        fi
        exec ./tkfs -f orchestrator.toml start

# Folders:  docker compose exec tkfs-daemon ./tkfs manage create NAME --headless
# Status:   docker compose exec tkfs-daemon ./tkfs manage status
# Pairing:  docker compose exec tkfs-daemon ./tkfs manage reset-pairing-code
#           (and set [network] listen / advertise in orchestrator.toml to accept peers)
