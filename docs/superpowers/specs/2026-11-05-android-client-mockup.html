<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android client screens</title>
<style>
:root {
  --page: transparent;
  --caption: #56635f;
  --heading: #17211f;
  --surface: #f6f8f7;
  --raised: #e6ecea;
  --line: #cfd8d5;
  --ink: #17211f;
  --quiet: #56635f;
  --pine: #0e6b5a;
  --on-pine: #ffffff;
  --pine-soft: #bfebdd;
  --on-pine-soft: #00382d;
  --amber: #7d5200;
  --amber-soft: #ffe3ae;
  --red: #b3261e;
  --red-soft: #f9dedc;
  --frame: #2b3331;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --caption: #a9b6b2;
    --heading: #e3ebe8;
    --surface: #141a19;
    --raised: #222a28;
    --line: #38423f;
    --ink: #e3ebe8;
    --quiet: #a9b6b2;
    --pine: #7fd8c1;
    --on-pine: #00382d;
    --pine-soft: #0a4f42;
    --on-pine-soft: #bfebdd;
    --amber: #f2c063;
    --amber-soft: #4d3600;
    --red: #f2b8b5;
    --red-soft: #5c1a15;
    --frame: #4a5552;
  }
}
:root[data-theme="dark"] {
  --caption: #a9b6b2;
  --heading: #e3ebe8;
  --surface: #141a19;
  --raised: #222a28;
  --line: #38423f;
  --ink: #e3ebe8;
  --quiet: #a9b6b2;
  --pine: #7fd8c1;
  --on-pine: #00382d;
  --pine-soft: #0a4f42;
  --on-pine-soft: #bfebdd;
  --amber: #f2c063;
  --amber-soft: #4d3600;
  --red: #f2b8b5;
  --red-soft: #5c1a15;
  --frame: #4a5552;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--heading);
  font: 14px/1.45 Roboto, "Google Sans", "Segoe UI", system-ui, sans-serif;
}
.sheet {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 340px));
  gap: 32px 24px;
  justify-content: center;
}
figure { margin: 0; }
figcaption { padding: 12px 4px 0; color: var(--caption); font-size: 13px; }
figcaption strong { display: block; color: var(--heading); font-size: 15px; font-weight: 500; }

/* A phone: fixed height so the screens compare side by side. */
.phone {
  height: 560px;
  border: 5px solid var(--frame);
  border-radius: 30px;
  background: var(--surface);
  color: var(--ink);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
}
.bar { display: flex; align-items: center; gap: 12px; padding: 18px 16px 10px; }
.bar h2 { margin: 0; flex: 1; font-size: 20px; font-weight: 500; }
.body { flex: 1; overflow: hidden; padding: 0 16px; }
.foot { padding: 12px 16px 16px; }
svg.i { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* The one loud thing: every state is a sentence in its own colour. */
.state { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--quiet); }
.state svg.i { width: 16px; height: 16px; }
.state.ok { color: var(--pine); }
.state.wait { color: var(--amber); font-weight: 500; }
.state.bad { color: var(--red); font-weight: 500; }

.strip { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--amber-soft); color: var(--ink); font-size: 13px; margin-bottom: 8px; }
.strip svg.i { color: var(--amber); }

.row { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .icon { color: var(--quiet); }
.row .text { flex: 1; min-width: 0; }
.row .name { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small { font-size: 13px; color: var(--quiet); }
.mark { color: var(--quiet); }
.mark.on { color: var(--pine); }
.mark.wait { color: var(--amber); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; border: 0; border-radius: 22px; background: var(--pine); color: var(--on-pine); font: 500 14px/1 inherit; font-family: inherit; }
.btn.soft { background: var(--pine-soft); color: var(--on-pine-soft); }
.btn.line { background: none; border: 1px solid var(--line); color: var(--pine); }
.meta { margin: 10px 0 0; text-align: center; font-size: 12px; color: var(--quiet); }

/* Bottom sheet over Browse. */
.scrim { position: absolute; inset: 0; background: rgba(10, 18, 16, .42); }
.bottom { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 22px 22px 0 0; padding: 14px 20px 16px; }
.bottom b { display: block; font-weight: 500; font-size: 15px; }
.action { display: flex; gap: 14px; align-items: center; padding: 11px 0; font-size: 15px; }
.action.danger { color: var(--red); }

.field { display: block; margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.field small { display: block; color: var(--quiet); font-size: 12px; }
.field span { font-size: 15px; overflow-wrap: anywhere; }
.or { margin: 14px 0 2px; text-align: center; color: var(--quiet); font-size: 13px; }
.lead { margin: 0 0 14px; font-size: 15px; }

.version { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.version .who { display: block; font-size: 15px; font-weight: 500; }
.version .acts { display: flex; gap: 8px; margin-top: 10px; }
.version .btn { min-height: 36px; font-size: 13px; }

.choice { display: flex; gap: 14px; align-items: center; padding: 12px 0; font-size: 15px; border-bottom: 1px solid var(--line); }
.dot { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid var(--quiet); }
.dot.on { border-color: var(--pine); box-shadow: inset 0 0 0 3px var(--surface); background: var(--pine); }

.set { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.set:last-child { border-bottom: 0; }
.set .text { flex: 1; min-width: 0; }
.set .name { display: block; font-size: 15px; }
.set small { font-size: 13px; color: var(--quiet); overflow-wrap: anywhere; }
.toggle { width: 40px; height: 24px; border-radius: 12px; background: var(--raised); border: 2px solid var(--quiet); flex: none; position: relative; }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--quiet); }
.link { color: var(--pine); font-weight: 500; font-size: 13px; margin-right: 14px; }
@media (max-width: 380px) {
  .sheet { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 3 3 4-4 4 4"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4.5L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14 4.5l2-2M20 20v-4.5h-4.5"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 11a3.5 3.5 0 0 1 0 7z"/></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M12 19V6M6 12l6-6 6 6"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 4H7l3-4zM12 14v6"/></symbol>
  <symbol id="warn" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19zM12 10v4.5M12 17.5v.2"/></symbol>
  <symbol id="qr" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1"/><path d="M14 14h3v3M20.5 14v.2M14 20.5h.2M17 20.5h3.5V17"/></symbol>
  <symbol id="share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></symbol>
  <symbol id="free" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 11a3.5 3.5 0 0 1 0 7zM4 4l16 16"/></symbol>
</svg>

<main class="sheet">

<figure>
  <div class="phone">
    <div class="bar"><h2>Telekinesis</h2><svg class="i"><use href="#sync"/></svg></div>
    <div class="body">
      <div class="strip"><svg class="i"><use href="#warn"/></svg><span>My PC isn't reachable. Last synced at 14:02.</span></div>
      <div class="row"><svg class="i icon"><use href="#folder"/></svg><div class="text"><span class="name">Documents</span><span class="state ok">Synced at 14:02</span></div></div>
      <div class="row"><svg class="i icon"><use href="#folder"/></svg><div class="text"><span class="name">Transfer</span><span class="state wait">3 files waiting to send</span></div></div>
      <div class="row"><svg class="i icon"><use href="#folder"/></svg><div class="text"><span class="name">Projects</span><span class="state bad">2 conflicts to settle</span></div></div>
    </div>
    <div class="foot">
      <button class="btn">Sync now</button>
      <p class="meta">4.8 GB on this phone, 61 GB free</p>
    </div>
  </div>
  <figcaption><strong>Folders</strong>Each folder says its state in a sentence, so the phone never looks fine while nothing is syncing.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="bar"><svg class="i"><use href="#back"/></svg><h2>Transfer</h2></div>
    <div class="body">
      <div class="row"><svg class="i icon"><use href="#image"/></svg><div class="text"><span class="name">IMG_2041.jpg</span><small>On this phone, 3.4 MB</small></div><svg class="i mark on"><use href="#check"/></svg></div>
      <div class="row"><svg class="i icon"><use href="#file"/></svg><div class="text"><span class="name">relatorio-outubro.pdf</span><small>Waiting to send, 2.3 MB</small></div><svg class="i mark wait"><use href="#up"/></svg></div>
      <div class="row"><svg class="i icon"><use href="#file"/></svg><div class="text"><span class="name">video-obra.mp4</span><small>Not downloaded, 812 MB</small></div><svg class="i mark"><use href="#cloud"/></svg></div>
    </div>
    <div class="scrim"></div>
    <div class="bottom">
      <b>IMG_2041.jpg</b>
      <div class="action"><svg class="i"><use href="#pin"/></svg>Keep on this phone</div>
      <div class="action"><svg class="i"><use href="#free"/></svg>Remove download</div>
      <div class="action"><svg class="i"><use href="#share"/></svg>Share</div>
      <div class="action"><svg class="i"><use href="#edit"/></svg>Rename</div>
      <div class="action danger"><svg class="i"><use href="#trash"/></svg>Delete everywhere</div>
    </div>
  </div>
  <figcaption><strong>Browse</strong>Tap opens the file in another app. A long press holds what the Files app has no room for. Remove download and Delete everywhere are worded apart on purpose.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="bar"><h2>Save to Telekinesis</h2></div>
    <div class="body">
      <p class="lead">2 photos from Photos</p>
      <div class="choice"><span class="dot"></span>Documents</div>
      <div class="choice"><span class="dot on"></span>Transfer</div>
      <div class="choice"><span class="dot"></span>Projects</div>
      <label class="field"><small>Inside this folder</small><span>Transfer (top level)</span></label>
    </div>
    <div class="foot">
      <button class="btn">Save 2 files</button>
      <p class="meta">They go to My PC when it's reachable.</p>
    </div>
  </div>
  <figcaption><strong>Share in</strong>The transfer buffer's main path: Share from any app, pick a folder, done. A name clash gets a numbered name.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="bar"><svg class="i"><use href="#back"/></svg><h2>Add a PC</h2></div>
    <div class="body">
      <p class="lead">On your PC, create a new pairing code in Telekinesis. It shows a QR code.</p>
      <button class="btn"><svg class="i"><use href="#qr"/></svg>Scan QR code</button>
      <p class="or">or enter it yourself</p>
      <label class="field"><small>PC address</small><span>ws://192.168.0.20:43180</span></label>
      <label class="field"><small>Pairing code, 64 characters</small><span>••••••••••••••••••••••••</span></label>
    </div>
    <div class="foot"><button class="btn soft">Pair</button></div>
  </div>
  <figcaption><strong>Add a PC</strong>Your call: this QR version, or the two fields alone. After pairing, it lists that PC's folders to receive.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="bar"><svg class="i"><use href="#back"/></svg><h2>Conflicts</h2></div>
    <div class="body">
      <p class="lead">Both versions stay until you choose.</p>
      <span class="row" style="border:0;padding:0 0 2px"><span class="text"><span class="name">orcamento-2026.xlsx</span></span></span>
      <div class="version"><span class="who">My PC</span><small>Today at 11:20, 2.1 MB</small><div class="acts"><button class="btn line">Preview</button><button class="btn soft">Keep this one</button></div></div>
      <div class="version"><span class="who">This phone</span><small>Today at 11:42, 2.3 MB</small><div class="acts"><button class="btn line">Preview</button><button class="btn soft">Keep this one</button></div></div>
      <div class="row" style="margin-top:8px"><svg class="i icon"><use href="#file"/></svg><div class="text"><span class="name">notas.txt</span><small>2 versions</small></div></div>
    </div>
  </div>
  <figcaption><strong>Conflicts</strong>Same model as the desktop. Nothing is overwritten and neither device wins by itself.</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="bar"><svg class="i"><use href="#back"/></svg><h2>Settings</h2></div>
    <div class="body">
      <div class="set"><div class="text"><span class="name">Sync on mobile data</span><small>Off: only file lists update. Files you open still download.</small></div><span class="toggle"></span></div>
      <div class="set"><div class="text"><span class="name">Background check</span><small>Every 30 min</small></div></div>
      <div class="set"><div class="text"><span class="name">Keep this much free</span><small>12.8 GB. Oldest downloads go first.</small><br><span class="link">Free up space now</span></div></div>
      <div class="set"><div class="text"><span class="name">Battery</span><small>Allowed to run in the background</small></div></div>
      <div class="set"><div class="text"><span class="name">My PC</span><small>ws://192.168.0.20:43180</small><br><span class="link">Change address</span><span class="link">Unpair</span></div></div>
      <div class="set"><div class="text"><span class="name">Diagnostics</span><span class="link">Copy</span><span class="link">Resync from the start</span></div></div>
    </div>
  </div>
  <figcaption><strong>Settings</strong>Few on purpose. Keep and Remove live with the files, not here.</figcaption>
</figure>

</main>
</body>
</html>
