# Same receiver schema, mapped to a Linux O1 parser fixture.
# Parser acceptance does not prove availability of the protected Linux provider.
format_version = 1
installation = '22222222-2222-4222-8222-222222222222'
orchestrator_config = '../../orchestrator.linux.toml'
data_directory = 'registry'
transport = 'wss'
inbound = true
dial = true
listen = '127.0.0.1:7421'
advertise = 'wss://127.0.0.1:7421/tkfs/sync'
enrollment_advertise = 'wss://127.0.0.1:7421/tkfs/enroll'

[credential]
backend = 'platform-encrypted'
file = 'identity.encrypted'
name = 'tkfs-identity-33333333-3333-4333-8333-333333333333-receiver'
