# Managed receiver shape only: loopback reaches this computer, not another host.
# The real generated filename is server.toml; paths below are readable examples.
format_version = 1
installation = '22222222-2222-4222-8222-222222222222'
orchestrator_config = '../../orchestrator.windows.toml'
data_directory = 'registry'
transport = 'wss'
inbound = true
dial = true
listen = '127.0.0.1:7421'
advertise = 'wss://127.0.0.1:7421/tkfs/sync'
enrollment_advertise = 'wss://127.0.0.1:7421/tkfs/enroll'
# enrollment_listen must stay empty/omitted for one-port WSS.
# Normal OPAQUE enrollment uses /tkfs/enroll-v3 internally; don't edit this URL.

[credential]
backend = 'platform-encrypted'
file = 'identity.encrypted'
name = 'tkfs-identity-33333333-3333-4333-8333-333333333333-receiver'
