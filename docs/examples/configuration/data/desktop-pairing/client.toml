# Managed outbound shape only. The app writes absolute paths and generated IDs.
# No credentials/setup records are supplied; do not use this as a live identity.
format_version = 1
installation = '11111111-1111-4111-8111-111111111111'
data_directory = 'registry'
transport = 'wss'
inbound = false
dial = true
advertise = 'outbound-only'
# listen, enrollment_listen, enrollment_advertise are empty when omitted.
# No orchestrator_config: the separate setup record binds this client to O1.

[credential]
backend = 'platform-encrypted'
file = 'identity.encrypted'
name = 'tkfs-identity-33333333-3333-4333-8333-333333333333-client'
