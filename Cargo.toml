[package]
name = "tkfs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
flate2 = "1.1"
rand = "0.8"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "hooks", "fallible_uint"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.23", features = ["v4", "serde"] }
unicode-normalization = "0.1"
toml = "0.9"
polling = "=3.11.0"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "native-tls"] }

[target.'cfg(windows)'.dependencies]
slint = { version = "=1.17.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }

[target.'cfg(windows)'.build-dependencies]
cc = "1.2"
slint-build = "=1.17.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
native-tls = "0.2"
tempfile = "3.27"
