[package]
name = "tkfs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.23", features = ["v4", "serde"] }
unicode-normalization = "0.1"
toml = "0.9"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tempfile = "3.27"
